name = "moosify-website"
account_id = "0d88ec410e04d6b7b705064405e8824a"
main = "cloudflare-worker.js"
workers_dev = true
compatibility_date = "2024-01-01"

# Secrets (CEREBRAS_API_KEY, GROQ_API_KEY, CHAT_STATUS, GOOGLE_CLIENT_ID, SESSION_SECRET)
# are set on the Worker by the deploy workflow, not in this file.

[ai]
binding = "AI"

# Saved accounts (chat, cart, orders). The id is filled in by scripts/setup-d1.sh,
# which creates the database on first run and applies migrations/.
[[d1_databases]]
binding = "DB"
database_name = "moosify"
database_id = "abbc6f11-9e65-4dd1-b23c-15d8810d44bb"
migrations_dir = "migrations"
