name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configure Moosy connection
        env:
          API_URL: ${{ secrets.API_URL }}
          CHAT_STATUS: ${{ secrets.CHAT_STATUS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          api_url = json.dumps(os.environ.get("API_URL", ""))
          chat_status = json.dumps(os.environ.get("CHAT_STATUS", "up") or "up")
          google_client_id = json.dumps(os.environ.get("GOOGLE_CLIENT_ID", ""))
          for path in Path(".").rglob("*.html"):
              html = path.read_text()
              html = html.replace(
                  '"__API_URL_PLACEHOLDER__"',
                  api_url
              )
              html = html.replace(
                  '"__CHAT_STATUS_PLACEHOLDER__"',
                  chat_status
              )
              html = html.replace(
                  '"__GOOGLE_CLIENT_ID_PLACEHOLDER__"',
                  google_client_id
              )
              path.write_text(html)
          PY

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
