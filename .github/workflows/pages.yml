name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configure Moosy connection
        env:
          API_URL: ${{ secrets.API_URL }}
          CHAT_STATUS: ${{ secrets.CHAT_STATUS }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text()
          api_url = json.dumps(os.environ.get("API_URL", ""))
          chat_status = json.dumps(os.environ.get("CHAT_STATUS", "up") or "up")
          html = html.replace(
              'const API_URL = "__API_URL_PLACEHOLDER__";',
              f"const API_URL = {api_url};"
          )
          html = html.replace(
              'const CURRENT_CHAT_STATUS = "__CHAT_STATUS_PLACEHOLDER__";',
              f"const CURRENT_CHAT_STATUS = {chat_status};"
          )
          path.write_text(html)
          PY

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
