<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img" aria-label="Moosify OPhone shelf">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9e5ff"/>
      <stop offset="1" stop-color="#fff6dc"/>
    </linearGradient>
  </defs>
  <rect width="900" height="506" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="160" cy="80" rx="70" ry="26"/><ellipse cx="205" cy="66" rx="46" ry="32"/>
    <ellipse cx="740" cy="110" rx="80" ry="28"/><ellipse cx="790" cy="94" rx="48" ry="34"/>
  </g>
  <!-- display wall -->
  <rect x="110" y="110" width="680" height="270" rx="22" fill="#7a4a2a"/>
  <rect x="130" y="130" width="640" height="16" rx="8" fill="#a86b3c"/>
  <rect x="130" y="250" width="640" height="16" rx="8" fill="#a86b3c"/>
  <!-- top shelf phones -->
  <g>
    <g transform="translate(160 160)"><rect width="84" height="82" rx="14" fill="#172033"/><rect x="8" y="8" width="68" height="66" rx="8" fill="#f48b2a"/></g>
    <g transform="translate(270 160)"><rect width="84" height="82" rx="14" fill="#172033"/><rect x="8" y="8" width="68" height="66" rx="8" fill="#f48b2a"/></g>
    <g transform="translate(380 160)"><rect width="84" height="82" rx="14" fill="#172033"/><rect x="8" y="8" width="68" height="66" rx="8" fill="#f48b2a"/></g>
    <g transform="translate(490 160)"><rect width="84" height="82" rx="14" fill="#172033"/><rect x="8" y="8" width="68" height="66" rx="8" fill="#f48b2a"/></g>
  </g>
  <!-- price tags on top shelf -->
  <g font-family="DM Sans, Arial, sans-serif" font-weight="800" font-size="18" text-anchor="middle">
    <rect x="152" y="250" width="100" height="30" rx="8" fill="#fff8e9"/><text x="202" y="271" fill="#172033">$199</text>
    <rect x="262" y="250" width="100" height="30" rx="8" fill="#fff8e9"/><text x="312" y="271" fill="#172033">$249</text>
    <rect x="372" y="250" width="100" height="30" rx="8" fill="#fff8e9"/><text x="422" y="271" fill="#172033">$299</text>
    <rect x="482" y="250" width="100" height="30" rx="8" fill="#fff8e9"/><text x="532" y="271" fill="#172033">$349</text>
  </g>
  <!-- counter -->
  <rect x="110" y="330" width="680" height="110" rx="14" fill="#5a3a22"/>
  <path d="M140 362 H760" stroke="#fff8e9" stroke-width="3" stroke-dasharray="12 9" opacity="0.6"/>
  <g transform="translate(300 380)"><rect width="84" height="82" rx="14" fill="#172033"/><rect x="8" y="8" width="68" height="66" rx="8" fill="#f48b2a"/></g>
  <g transform="translate(410 380)"><rect width="84" height="82" rx="14" fill="#172033"/><rect x="8" y="8" width="68" height="66" rx="8" fill="#f48b2a"/></g>
  <g transform="translate(520 380)"><rect width="84" height="82" rx="14" fill="#172033"/><rect x="8" y="8" width="68" height="66" rx="8" fill="#f48b2a"/></g>
</svg>
